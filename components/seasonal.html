<!-- SEASONAL CAROUSEL -->
<section class="seasonal">
  <div class="container">
    <h2>Seasonal</h2>
    <div class="carousel-wrapper">
      <button class="carousel-btn carousel-prev" aria-label="Previous">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="carousel-track">
        <div class="carousel-card">
          <div class="card-image placeholder-spring"></div>
          <p class="card-label">Spring</p>
        </div>
        <div class="carousel-card">
          <div class="card-image placeholder-summer"></div>
          <p class="card-label">Summer</p>
        </div>
        <div class="carousel-card">
          <div class="card-image placeholder-autumn"></div>
          <p class="card-label">Autumn</p>
        </div>
        <div class="carousel-card">
          <div class="card-image placeholder-christmas"></div>
          <p class="card-label">Christmas</p>
        </div>
        <div class="carousel-card">
          <div class="card-image placeholder-easter"></div>
          <p class="card-label">Easter</p>
        </div>
        <div class="carousel-card">
          <div class="card-image placeholder-valentines"></div>
          <p class="card-label">Valentine's</p>
        </div>
      </div>
      <button class="carousel-btn carousel-next" aria-label="Next">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>
</section>
